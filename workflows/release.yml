name: 📦 Create Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc*'
      - 'v*.*.*-beta*'
      - 'v*.*.*-alpha*'

jobs:
  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🏷️ Get version from tag
      id: get_version
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "VERSION=${GITHUB_REF#refs/tags/}"
        
        # Remove v prefix for semantic version
        SEMVER=${GITHUB_REF#refs/tags/v}
        echo "SEMVER=${SEMVER}" >> $GITHUB_OUTPUT
        
        # Check if pre-release
        if [[ "${SEMVER}" == *-* ]]; then
          echo "PRERELEASE=true" >> $GITHUB_OUTPUT
        else
          echo "PRERELEASE=false" >> $GITHUB_OUTPUT
        fi

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine setuptools wheel

    - name: 🏗️ Build distribution packages
      run: |
        python -m build
        twine check dist/*

    - name: 📝 Generate release notes
      id: release_notes
      run: |
        # Extract changes from CHANGELOG.md for this version
        VERSION="${{ steps.get_version.outputs.SEMVER }}"
        sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | head -n -1 > release_notes.md
        echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: 📦 Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: GitClonePro ${{ steps.get_version.outputs.VERSION }}
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## 🚀 GitClonePro Release ${{ steps.get_version.outputs.VERSION }}
          
          ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          
          ---
          
          ### 📦 Installation
          ```bash
          pip install gitclonepro==${{ steps.get_version.outputs.SEMVER }}